<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game with Overlay Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="chatOverlay" class="chat-overlay">
            <div id="chatMessages" class="chat-messages">
                <div class="system-msg">System: Press [Enter] to start typing!</div>
            </div>
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="100" autocomplete="off" />
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
